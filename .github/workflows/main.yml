name: Generate Datas

on:
  schedule:
    - cron: "0 5 * * 1" # semanal: lunes 00:00 Colombia (UTC-5)
  workflow_dispatch:

# Permisos para que el token pueda escribir al repo (necesario para publicar)
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (opcional, pero recomendado)
        uses: actions/checkout@v4

      - name: Asegurar carpeta de salida
        run: mkdir -p dist

      - name: Generar Snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: AL3X09  # <-- cambia por tu usuario
          svg_out_path: dist/github-contribution-grid-snake.svg

      - name: Verificar que el SVG existe
        run: |
          ls -la dist
          test -f dist/github-contribution-grid-snake.svg

      - name: Publicar a GitHub Pages (rama "output")
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
